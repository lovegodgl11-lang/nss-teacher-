    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-primary: #f7f8fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-primary: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e5e7eb;
        }
        html, body { height: 100%; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); }
        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 0.5rem; font-size: 1rem; background-color: var(--bg-secondary);
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 20%, transparent);
        }
        .card {
            background-color: var(--bg-secondary); border-radius: 1rem; padding: 1.5rem;
            border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.05);
        }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 600px; }
        #toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; background-color: #1f2937; color: white;
            padding: 0.75rem 1.25rem; border-radius: 0.5rem; z-index: 1200; opacity: 0;
            transition: opacity .3s ease, transform .3s ease; transform: translateY(20px);
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        .tab-button.active { background-color: var(--accent-primary); color: white; }
        
        /* Live Class View */
        .classroom-container { display: flex; height: calc(100vh - 10rem); gap: 1rem; }
        .main-video-area { flex-grow: 1; background-color: #000; border-radius: 1rem; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .main-video-area video { width: 100%; height: 100%; object-fit: cover; }
        .classroom-sidebar { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1rem; }
        .participants-panel, .chat-panel { background-color: var(--bg-secondary); border-radius: 1rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .participants-panel { flex-shrink: 0; }
        .chat-panel { flex-grow: 1; }
        .panel-header { padding: 0.75rem 1rem; font-weight: 700; border-bottom: 1px solid var(--border-color); }
        .panel-body { padding: 1rem; overflow-y: auto; flex-grow: 1; }
        .chat-messages { display: flex; flex-direction: column; gap: 0.75rem; }
        .chat-message { padding: 0.5rem 0.75rem; border-radius: 0.5rem; max-width: 80%; }
        .chat-message.self { background-color: var(--accent-primary); color: white; align-self: flex-end; }
        .chat-message.other { background-color: #f3f4f6; align-self: flex-start; }
        .chat-input { border-top: 1px solid var(--border-color); padding: 0.75rem; display: flex; gap: 0.5rem; }
        .video-controls { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); background-color: rgba(0,0,0,0.5); padding: 0.75rem 1.5rem; border-radius: 9999px; display: flex; gap: 1rem; }
        .control-btn { width: 48px; height: 48px; border-radius: 50%; background-color: rgba(255,255,255,0.2); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; transition: background-color 0.2s; }
        .control-btn:hover { background-color: rgba(255,255,255,0.3); }
        .control-btn.danger { background-color: #ef4444; }
        .control-btn.danger:hover { background-color: #dc2626; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .qr-card { 
                width: 48%; height: auto; border: 1px solid black; padding: 10px; margin: 1%;
                page-break-inside: avoid;
            }
        }

    <main class="flex-1 p-8 overflow-y-auto hidden">

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7gB7FbMFtG1k1vJGVI3XVCyCUNeZIC7M",
        databaseURL: "https://smart-school-e9f86-default-rtdb.asia-southeast1.firebasedatabase.app",
    };
    
    // --- APP STATE (GLOBAL) ---
    let db;
    let teacher = null;
    let students = [];
    let homework = [];
    let liveClasses = [];
    let attendanceRecords = [];
    let teacherAttendanceRecords = [];
    let results = [];
    let salaries = [];
    let classSubjects = {};
    let localStream = null;
    let activeDBListeners = [];
    let studentQrScanner;
    const mainContent = document.getElementById('app-content-container');
    
    // --- UTILITIES ---
    function openFormModal(title, formHTML, onSubmit) {
        const modal = document.getElementById('form-modal');
        modal.querySelector('#form-modal-title').textContent = title;
        const formBody = modal.querySelector('#form-modal-body');
        formBody.innerHTML = formHTML;
        modal.classList.add('active');
        const handleSubmit = (e) => { e.preventDefault(); if(onSubmit(formBody)) closeFormModal(); };
        const closeFormModal = () => { modal.classList.remove('active'); formBody.removeEventListener('submit', handleSubmit); };
        formBody.addEventListener('submit', handleSubmit);
        modal.querySelectorAll('.form-modal-cancel').forEach(btn => btn.addEventListener('click', closeFormModal));
    }
    function showToast(message, isError=false) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.style.backgroundColor = isError ? '#ef4444' : '#1f2937';
        t.textContent = message; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    function logout() {
        sessionStorage.removeItem('loggedInUser');
        teacher = null; students = []; homework = []; liveClasses = []; attendanceRecords = []; teacherAttendanceRecords = []; results = []; salaries = []; classSubjects = {};
        document.querySelector('nav').classList.add('hidden');
        document.querySelector('main').classList.add('hidden');
        showLogin();
    }
    function cleanupDBListeners() {
        activeDBListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeDBListeners = [];
    }
    function addDBListener(ref, type, callback) {
        ref.on(type, callback);
        activeDBListeners.push({ ref, type, callback });
    }

    // --- RENDER FUNCTIONS ---
    function renderDashboard() {
        const studentsInClass = students.filter(s => s.className === teacher.assignedClass && s.section === teacher.assignedSection);
        const today = new Date().toISOString().split('T')[0];
        const attendanceRecordId = `${today}_${teacher.assignedClass}_${teacher.assignedSection}`;
        const todaysAttendance = attendanceRecords.find(r => r.id === attendanceRecordId);
        let presentCount = 0;
        if(todaysAttendance && todaysAttendance.attendance) {
            presentCount = Object.values(todaysAttendance.attendance).filter(status => status === 'Present').length;
        }
        const attendancePercent = studentsInClass.length > 0 ? ((presentCount / studentsInClass.length) * 100).toFixed(0) : 0;
        const todaysLiveClasses = liveClasses.filter(lc => lc.teacherId === teacher.id && lc.date === today);

        mainContent.innerHTML = `
            <div class="space-y-8">
                <div>
                    <h3 class="text-2xl font-bold">Welcome, ${teacher.staffName}!</h3>
                    <p class="text-gray-600 mt-1">Here's a summary of your class: <strong>${teacher.assignedClass || 'N/A'} - ${teacher.assignedSection || 'N/A'}</strong></p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="card"><h3 class="font-semibold text-gray-500">Total Students</h3><p class="text-4xl font-extrabold mt-2">${studentsInClass.length}</p></div>
                    <div class="card"><h3 class="font-semibold text-gray-500">Today's Attendance</h3><p class="text-4xl font-extrabold text-indigo-600 mt-2">${attendancePercent}%</p></div>
                    <div class="card"><h3 class="font-semibold text-gray-500">Pending Homework</h3><p class="text-4xl font-extrabold mt-2">${homework.filter(h => new Date(h.dueDate) > new Date()).length}</p></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                     <div class="card">
                         <h4 class="font-bold text-lg mb-4">Quick Actions</h4>
                         <div class="space-y-3">
                            <button onclick="setActiveTab('attendance')" class="w-full text-left p-4 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700">Take Today's Attendance</button>
                            <button onclick="setActiveTab('homework')" class="w-full text-left p-4 rounded-lg font-semibold text-white bg-sky-500 hover:bg-sky-600">Assign New Homework</button>
                            <button onclick="setActiveTab('results')" class="w-full text-left p-4 rounded-lg font-semibold text-white bg-amber-500 hover:bg-amber-600">Enter Student Marks</button>
                         </div>
                     </div>
                      <div class="card">
                         <h4 class="font-bold text-lg mb-4">Today's Live Classes</h4>
                         <div class="space-y-3">
                             ${todaysLiveClasses.length > 0 ? todaysLiveClasses.map(lc => `
                                <div class="p-3 border rounded-lg flex justify-between items-center">
                                    <div><p class="font-semibold">${lc.topic}</p><p class="text-sm text-gray-500">at ${lc.startTime}</p></div>
                                    <a href="${lc.meetingUrl}" target="_blank" class="bg-green-600 text-white font-semibold py-1 px-3 text-sm rounded-lg hover:bg-green-700">Join</a>
                                </div>
                             `).join('') : '<p class="text-center py-8 text-gray-500">No live classes scheduled for today.</p>'}
                         </div>
                     </div>
                </div>
            </div>
        `;
    }

    function renderMyAttendance() {
        const currentMonth = new Date().toISOString().slice(0, 7);
        mainContent.innerHTML = `<div class="card mb-6"><div class="flex items-end gap-4"><div><label for="my-attendance-month" class="block text-sm font-medium">Month</label><input type="month" id="my-attendance-month" class="form-input mt-1" value="${currentMonth}"></div></div></div><div id="my-attendance-sheet-container"></div>`;
        document.getElementById('my-attendance-month').addEventListener('change', renderMyAttendanceSheet);
        renderMyAttendanceSheet();
    }
    
    function renderMyAttendanceSheet() {
        const monthValue = document.getElementById('my-attendance-month')?.value;
        const container = document.getElementById('my-attendance-sheet-container');
        if (!monthValue || !container) return;

        const [year, month] = monthValue.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();

        const recordsForMonth = teacherAttendanceRecords.filter(r => r.date && r.date.startsWith(monthValue));
        const myId = teacher.id;

        let tableRows = '';
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${monthValue}-${String(day).padStart(2, '0')}`;
            const record = recordsForMonth.find(r => r.date === dateStr);
            const myAttendance = record?.attendance?.[myId];

            let checkIn = 'N/A';
            let checkOut = 'N/A';
            let status = 'Absent';
            let statusClass = 'bg-red-100 text-red-700';

            if (myAttendance) {
                checkIn = myAttendance.checkIn || 'N/A';
                checkOut = myAttendance.checkOut || 'N/A';
                
                if (myAttendance.status) { // Status override
                    status = myAttendance.status;
                    statusClass = status === 'Leave' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
                } else if (myAttendance.checkIn) {
                    status = 'Present';
                    statusClass = 'bg-green-100 text-green-700';
                }
            }
            
            tableRows += `
                <tr class="border-b">
                    <td class="p-4">${dateStr}</td>
                    <td class="p-4">${checkIn}</td>
                    <td class="p-4">${checkOut}</td>
                    <td class="p-4"><span class="px-2 py-1 text-xs font-semibold rounded-full ${statusClass}">${status}</span></td>
                </tr>
            `;
        }

        container.innerHTML = `
            <div class="card">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead><tr class="border-b"><th class="p-4 text-left">Date</th><th class="p-4 text-left">Check-in</th><th class="p-4 text-left">Check-out</th><th class="p-4 text-left">Status</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            </div>
        `;
    }

    function renderHomework() {
        const teacherHomework = homework.filter(h => h.teacherId === teacher.id).sort((a,b) => new Date(b.date) - new Date(a.date));
        mainContent.innerHTML = `<div class="flex justify-end mb-6"><button id="add-homework-btn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" /></svg> Add Homework</button></div><div class="space-y-4">${teacherHomework.length > 0 ? teacherHomework.map(h => `<div class="card"><div class="flex justify-between items-start"><div><h4 class="font-bold text-lg">${h.title} <span class="text-sm font-normal text-gray-500">(${h.subject})</span></h4><p class="text-sm text-gray-500">For: Class ${h.className}-${h.section} | Due: ${h.dueDate}</p><p class="mt-2">${h.description}</p></div><button onclick="deleteHomework('${h.id}')" class="text-gray-400 hover:text-red-500 p-1">Delete</button></div></div>`).join('') : '<div class="card text-center text-gray-500 py-8">No homework assigned yet.</div>'}</div>`;
        document.getElementById('add-homework-btn').addEventListener('click', () => openHomeworkForm());
    }
    
    function renderLiveClass() {
        const teacherClasses = liveClasses.filter(lc => lc.teacherId === teacher.id).sort((a,b) => new Date(b.date) - new Date(a.date));
        const today = new Date().toISOString().split('T')[0];

        const getStatusBadge = (status) => {
            if (status === 'live') return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Live</span>`;
            if (status === 'ended') return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Ended</span>`;
            return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">Scheduled</span>`;
        };

        mainContent.innerHTML = `<div class="flex justify-end mb-6"><button id="add-liveclass-btn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" /></svg> Schedule Class</button></div><div class="space-y-4">${teacherClasses.length > 0 ? teacherClasses.map(lc => {
            const isToday = lc.date === today;
            const canStart = isToday && lc.status === 'scheduled';
            return `
            <div class="card">
                <div class="flex justify-between items-center">

    async function saveStudentAttendance() {
        const date = document.getElementById('attendance-date').value;
        const studentsInClass = students.filter(s => s.className === teacher.assignedClass && s.section === teacher.assignedSection);
        const newAttendance = {};
        studentsInClass.forEach(s => { newAttendance[s.id] = document.querySelector(`input[name="status_${s.id}"]:checked`).value; });
        const recordId = `${date}_${teacher.assignedClass}_${teacher.assignedSection}`;
        await db.ref(`attendance/${recordId}`).set({ id: recordId, date, className: teacher.assignedClass, section: teacher.assignedSection, attendance: newAttendance, lastUpdated: new Date().toISOString() });
        showToast('Attendance Saved!');
    }
    
    function calculateStudentResult(event) {
        if(!event.target) return;
        const studentId = event.target.dataset.studentId;
        const row = document.getElementById(`result-row-${studentId}`);
        if(!row) return;

        const inputs = row.querySelectorAll('.marks-input');
        let total = 0;
        let subjectsCount = 0;
        inputs.forEach(input => {
            const value = parseInt(input.value);
            if (!isNaN(value)) total += value;
            subjectsCount++;
        });

        const maxMarks = subjectsCount * 100;
        const percentage = maxMarks > 0 ? ((total / maxMarks) * 100).toFixed(1) : 0;
        document.getElementById(`total-${studentId}`).textContent = total;
        document.getElementById(`percent-${studentId}`).textContent = `${percentage}%`;
    }

    async function saveResults() {
        const examType = document.getElementById('exam-type').value;
        if(!examType) { showToast('Exam type is missing.'); return; }
        const newResultsData = {};
        document.querySelectorAll('.marks-input').forEach(input => {
            const studentId = input.dataset.studentId;
            const subject = input.dataset.subject;
            if (!newResultsData[studentId]) newResultsData[studentId] = {};
            newResultsData[studentId][subject] = parseInt(input.value) || 0;
        });
        const resultId = `${examType}_${teacher.assignedClass}_${teacher.assignedSection}`.replace(/ /g, '_');
        await db.ref(`results/${resultId}`).set({ id: resultId, examType, className: teacher.assignedClass, section: teacher.assignedSection, results: newResultsData, lastUpdated: new Date().toISOString() });
        showToast('Results saved successfully!');
    }

    async function startLiveClass(classId) {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            await db.ref(`liveClasses/${classId}/status`).set('live');
            const liveClass = liveClasses.find(lc => lc.id === classId);
            if(liveClass) liveClass.status = 'live';
            renderTeacherClassroomView(classId);
        } catch(err) {
            console.error("Error starting class:", err);
            showToast("Could not access camera/microphone. Please check permissions.");
        }
    }
    async function endLiveClass(classId) {
        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        await db.ref(`liveClasses/${classId}/status`).set('ended');
        cleanupDBListeners();
        setActiveTab('liveclass');
    }

        const student = students.find(s => s.id === studentId);
        if (!student) return;

        const modal = document.getElementById('qr-modal');
        const content = document.getElementById('qr-modal-content');
        content.innerHTML = `
            <h3 class="font-bold text-xl mb-2">${student.studentName}</h3>
            <p class="text-gray-600 mb-4">Class: ${student.className}-${student.section}</p>
            <div id="qrcode-container" class="flex justify-center"></div>
            <div class="mt-6 flex justify-end gap-3">
                <button id="close-qr-modal" class="px-4 py-2 bg-gray-200 rounded-lg">Close</button>
                <button id="print-qr-code" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Print</button>
            </div>
        `;
        modal.classList.add('active');

        const qrcodeContainer = document.getElementById('qrcode-container');
        new QRCode(qrcodeContainer, {
            text: student.id,
            width: 200,
            height: 200
        });

        document.getElementById('close-qr-modal').onclick = () => modal.classList.remove('active');
        document.getElementById('print-qr-code').onclick = () => {
            const printContent = `<div style="text-align: center;"><h3 style="font-size: 1.25rem; font-weight: bold;">${student.studentName}</h3><p>${student.className}-${student.section}</p>${qrcodeContainer.innerHTML}</div>`;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent);
            printWindow.document.close();
            printWindow.print();
            printWindow.close();
        };
    }

    function printAllQRCodes() {
        const studentsInClass = students.filter(s => s.className === teacher.assignedClass && s.section === teacher.assignedSection);
        let printHtml = '<div id="print-area" class="flex flex-wrap">';
        studentsInClass.forEach(s => {
            const tempDiv = document.createElement('div');
            new QRCode(tempDiv, { text: s.id, width: 100, height: 100 });
            printHtml += `
                <div class="qr-card">
                    <p class="font-bold text-center">${s.studentName}</p>
                    <p class="text-sm text-center mb-2">${s.className} - ${s.section}</p>
                    <div class="flex justify-center">${tempDiv.innerHTML}</div>
                </div>
            `;
        });
        printHtml += '</div>';

        const printWindow = window.open('', '_blank');
        printWindow.document.write('<html><head><title>Print QR Codes</title>');
        printWindow.document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
        printWindow.document.write('<style>.qr-card { width: 48%; border: 1px solid black; padding: 10px; margin: 1%; page-break-inside: avoid; text-align: center; float: left; } .font-bold {font-weight: 700;} .text-sm {font-size: 0.875rem;} .mb-2 {margin-bottom: 0.5rem;} .flex {display:flex;} .justify-center {justify-content: center;}<\/style>');
        printWindow.document.write('</head><body>');
        printWindow.document.write(printHtml);
        printWindow.document.write('</body></html>');
        printWindow.document.close();
        setTimeout(() => { // Timeout to ensure content is rendered
            printWindow.print();
            printWindow.close();
        }, 500);
    }
    
    function startStudentScanner() {
        renderStudentAttendanceSheet(); // Make sure the sheet is visible
        const scannerView = document.getElementById('scanner-view');
        scannerView.innerHTML = '<div id="student-qr-reader" class="border-2 rounded-lg"></div>';
        scannerView.classList.remove('hidden');

        studentQrScanner = new Html5Qrcode("student-qr-reader");

        const onScanSuccess = (decodedText, decodedResult) => {
            const studentId = decodedText;
            const student = students.find(s => s.id === studentId);
            if (student) {
                const presentRadio = document.querySelector(`#attendance-row-${studentId} input[value="Present"]`);
                if (presentRadio) {
                    if (!presentRadio.checked) {
                        presentRadio.checked = true;
                        const row = document.getElementById(`attendance-row-${studentId}`);
                        row.style.backgroundColor = '#dcfce7';
                        setTimeout(() => { row.style.backgroundColor = ''; }, 2000);
                        showToast(`${student.studentName} marked present.`);
                    } else {
                         showToast(`${student.studentName} is already marked present.`, true);
                    }
                }
            } else {
                showToast("Invalid QR code.", true);
            }
        };

        studentQrScanner.start(
            { facingMode: "environment" },
            { fps: 5, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
            (error) => {} // onScanFailure
        ).catch(err => {
            showToast("Failed to start scanner. Check camera permissions.", true);
            console.error(err);
        });
    }

    // --- APP FLOW & NAVIGATION ---
    function setActiveTab(tabName) {
        // Before switching, cleanup classroom view if it exists
        document.querySelector('nav').classList.remove('hidden');
        document.querySelector('main header').classList.remove('hidden');
        if (studentQrScanner && studentQrScanner.isScanning) {
            studentQrScanner.stop();
        }

        const pageTitles = { dashboard: 'Dashboard', 'id-card': 'My ID Card', 'my-attendance': 'My Attendance', attendance: 'Student Attendance', 'qr-management': 'QR Management', homework: 'Manage Homework', results: 'Manage Results', liveclass: 'Live Classes', payouts: 'View Payouts' };
        document.getElementById('page-title').textContent = pageTitles[tabName];
        document.querySelectorAll('.tab-button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
        const renderFunction = { dashboard: renderDashboard, 'id-card': renderMyIDCard, 'my-attendance': renderMyAttendance, attendance: renderAttendance, 'qr-management': renderQRManagement, homework: renderHomework, results: renderResults, liveclass: renderLiveClass, payouts: renderPayouts }[tabName];
        if(renderFunction) renderFunction();
    }
    
    async function runApp(loggedInUser) {
        // Show app and hide login
        document.getElementById('login-overlay').classList.add('hidden');
        document.querySelector('nav').classList.remove('hidden');
        document.querySelector('main').classList.remove('hidden');

        // Show loading state in main content
        mainContent.innerHTML = `<div class="text-center p-8"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div><p class="mt-4 text-gray-600">Loading your data...</p></div>`;
        
        try {
            const refs = {
                staff: db.ref('staff').once('value'),
                students: db.ref('students').once('value'),
                homework: db.ref('homework').once('value'),
                liveClasses: db.ref('liveClasses').once('value'),
                attendance: db.ref('attendance').once('value'),
                teacherAttendance: db.ref('teacherAttendance').once('value'),
                results: db.ref('results').once('value'),
                salaries: db.ref('salaries').once('value'),
                subjects: db.ref('subjects').once('value'),
            };

            const snapshots = await Promise.all(Object.values(refs));
            const [staffSnap, studentsSnap, homeworkSnap, liveClassesSnap, attendanceSnap, teacherAttendanceSnap, resultsSnap, salariesSnap, subjectsSnap] = snapshots;

            const allStaff = Object.values(staffSnap.val() || {});
            teacher = allStaff.find(s => s.id === loggedInUser.id);

            if (!teacher) { logout(); throw new Error('Teacher profile not found.'); }
            
            students = Object.values(studentsSnap.val() || {});
            homework = Object.values(homeworkSnap.val() || {});
            liveClasses = Object.values(liveClassesSnap.val() || {});
            attendanceRecords = Object.values(attendanceSnap.val() || {});
            teacherAttendanceRecords = Object.values(teacherAttendanceSnap.val() || {});
            results = Object.values(resultsSnap.val() || {});
            salaries = Object.values(salariesSnap.val() || {});
            classSubjects = subjectsSnap.val() || {};

            // Setup UI
            document.getElementById('teacher-info').innerHTML = `<p class="font-semibold">${teacher.staffName}</p><p class="text-sm text-gray-500">${teacher.role}</p>`;
            document.querySelectorAll('.tab-button').forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)));
            document.getElementById('logout-btn').addEventListener('click', logout);
            setActiveTab('dashboard');

        } catch (error) {
            console.error("Failed to load teacher data:", error);
            mainContent.innerHTML = `<div class="card text-red-700 bg-red-100"><h3 class="font-bold">Error</h3><p>Could not load your data. Please log out and try again.</p></div>`;
        }
    }

    function showLogin() {
        document.getElementById('login-overlay').classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        const form = document.getElementById('teacher-login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('teacher-mobile').value;
            const password = document.getElementById('teacher-password').value;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Verifying...';
            
            try {
                const staffSnap = await db.ref('staff').once('value');
                const allStaff = Object.values(staffSnap.val() || {});
                const foundTeacher = allStaff.find(s => s.mobile === mobile && s.password === password);
                
                if (foundTeacher) {
                    const user = { role: 'teacher', id: foundTeacher.id };
                    sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                    runApp(user);
                } else {
                    showToast('Invalid Mobile No. or Password.');
                }
            } catch (err) {
                showToast('Login failed. Check connection.');
                console.error(err);
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        });
        
        let loggedInUser = null;
        try {
            const userData = sessionStorage.getItem('loggedInUser');
            if (userData) loggedInUser = JSON.parse(userData);
        } catch (e) {
            sessionStorage.removeItem('loggedInUser');
        }
        
        if (loggedInUser && loggedInUser.role === 'teacher') {
            runApp(loggedInUser);
        } else {
            showLogin();
        }
    });

</script>
