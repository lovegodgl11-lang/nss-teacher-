    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-primary: #f7f8fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-primary: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e5e7eb;
        }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); }
        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 0.5rem; font-size: 1rem; background-color: var(--bg-secondary);
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 20%, transparent);
        }
        .card {
            background-color: var(--bg-secondary); border-radius: 1rem; padding: 1.5rem;
            border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.05);
        }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 600px; }
        #toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem; background-color: #1f2937; color: white;
            padding: 0.75rem 1.25rem; border-radius: 0.5rem; z-index: 1200; opacity: 0;
            transition: opacity .3s ease, transform .3s ease; transform: translateY(20px);
        }
        #toast.show { opacity: 1; transform: translateY(0); }

        /* New Responsive Layout */
        .sidebar { transition: width 0.3s ease; }
        .sidebar.collapsed { width: 5rem; }
        .sidebar.collapsed .sidebar-header-text, .sidebar.collapsed .nav-text { display: none; }
        .sidebar.collapsed .nav-button { justify-content: center; }

        #bottom-nav { border-top: 1px solid var(--border-color); }
        .bottom-nav-btn { color: var(--text-secondary); }
        .bottom-nav-btn.active { color: var(--accent-primary); }

        @media (max-width: 767px) {
            .sidebar { display: none; }
            #bottom-nav { display: flex; }
            main { padding-bottom: 5rem; } /* Space for bottom nav */
        }
        @media (min-width: 768px) {
            #menu-toggle { display: block; }
            #bottom-nav { display: none; }
        }

        /* Scan Success Modal */
        #scan-success-modal .modal-content {
            background-color: var(--bg-secondary);
            padding: 2rem; border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;
            transform: scale(0.95); transition: transform 0.3s ease;
        }
        #scan-success-modal.active .modal-content { transform: scale(1); }
        
        /* QR scanner button */
        .qr-scan-btn {
            background-color: #374151;
            color: white;
        }
        .qr-scan-btn:hover {
            background-color: #1f2937;
        }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .qr-card { 
                width: 48%; height: auto; border: 1px solid black; padding: 10px; margin: 1%;
                page-break-inside: avoid;
            }
        }
    </style>

    function openFormModal(title, formHTML, onSubmit) {
        const modal = document.getElementById('form-modal');
        modal.querySelector('#form-modal-title').textContent = title;
        const formBody = modal.querySelector('#form-modal-body');
        formBody.innerHTML = formHTML;
        modal.classList.add('active');
        const handleSubmit = (e) => { e.preventDefault(); if(onSubmit(formBody)) closeFormModal(); };
        const closeFormModal = () => { modal.classList.remove('active'); formBody.removeEventListener('submit', handleSubmit); };
        formBody.addEventListener('submit', handleSubmit);
        modal.querySelectorAll('.form-modal-cancel').forEach(btn => btn.addEventListener('click', closeFormModal));
    }
    function showToast(message, isError=false) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.style.backgroundColor = isError ? '#ef4444' : '#1f2937';
        t.textContent = message; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    function logout() {
        sessionStorage.removeItem('loggedInUser');
        teacher = null; students = []; homework = []; liveClasses = []; attendanceRecords = []; teacherAttendanceRecords = []; results = []; salaries = []; classSubjects = {};
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        Object.values(peerConnections).forEach(pc => pc.close());
        peerConnections = {};
        cleanupDBListeners();
        document.getElementById('app-container').classList.add('hidden');
        showLogin();
    }
    function cleanupDBListeners() {
        activeDBListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeDBListeners = [];

    function addDBListener(ref, type, callback) {
        ref.on(type, callback);

            sound.play().catch(e => console.error("Audio play failed:", e));

            setTimeout(() => {
                modal.classList.remove('active');

        }

    function renderMyAttendance() {
        const currentMonth = new Date().toISOString().slice(0, 7);
        mainContent.innerHTML = `<div class="card mb-6"><div class="flex items-end gap-4"><div><label for="my-attendance-month" class="block text-sm font-medium">Month</label><input type="month" id="my-attendance-month" class="form-input mt-1" value="${currentMonth}"></div></div></div><div id="my-attendance-sheet-container"></div>`;
        document.getElementById('my-attendance-month').addEventListener('change', renderMyAttendanceSheet);
        renderMyAttendanceSheet();
    }
    
    function renderMyAttendanceSheet() {
        const monthValue = document.getElementById('my-attendance-month')?.value;
        const container = document.getElementById('my-attendance-sheet-container');
        if (!monthValue || !container) return;

        const [year, month] = monthValue.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();

        const recordsForMonth = teacherAttendanceRecords.filter(r => r.date && r.date.startsWith(monthValue));
        const myId = teacher.id;

        let tableRows = '';
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${monthValue}-${String(day).padStart(2, '0')}`;
            const record = recordsForMonth.find(r => r.date === dateStr);
            const myAttendance = record?.attendance?.[myId];

            let checkIn = 'N/A';
            let checkOut = 'N/A';
            let status = 'Absent';
            let statusClass = 'bg-red-100 text-red-700';

            if (myAttendance) {
                checkIn = myAttendance.checkIn || 'N/A';
                checkOut = myAttendance.checkOut || 'N/A';
                
                if (myAttendance.status) { // Status override
                    status = myAttendance.status;
                    statusClass = status === 'Leave' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
                } else if (myAttendance.checkIn) {
                    status = 'Present';
                    statusClass = 'bg-green-100 text-green-700';
                }
            }
            
            tableRows += `
                <tr class="border-b">
                    <td class="p-4">${dateStr}</td>
                    <td class="p-4">${checkIn}</td>
                    <td class="p-4">${checkOut}</td>
                    <td class="p-4"><span class="px-2 py-1 text-xs font-semibold rounded-full ${statusClass}">${status}</span></td>
                </tr>
            `;
        }

        container.innerHTML = `
            <div class="card">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead><tr class="border-b"><th class="p-4 text-left">Date</th><th class="p-4 text-left">Check-in</th><th class="p-4 text-left">Check-out</th><th class="p-4 text-left">Status</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            </div>
        `;
    }

                    </div>
                </div>

        document.getElementById('show-attendance-btn').addEventListener('click', renderStudentAttendanceSheet);

    function renderStudentAttendanceSheet() {
        if (studentQrScanner && studentQrScanner.isScanning) {
            studentQrScanner.stop();
        }
        const date = document.getElementById('attendance-date').value;
        const container = document.getElementById('attendance-sheet-container');
        if(!date) return;
        const studentsInClass = students.filter(s => s.className === teacher.assignedClass && s.section === teacher.assignedSection);
        const record = attendanceRecords.find(r => r.id === `${date}_${teacher.assignedClass}_${teacher.assignedSection}`);
        const attendanceData = record ? record.attendance : {};
        
        const rows = studentsInClass.map(s => `<tr class="border-b" id="attendance-row-${s.id}"><td class="p-4 font-semibold">${s.studentName}</td><td class="p-4"><div class="flex gap-4">

            <label><input type="radio" name="status_${s.id}" value="Absent" ${attendanceData[s.id] === 'Absent' ? 'checked' : ''}> Absent</label>
            <label><input type="radio" name="status_${s.id}" value="Leave" ${attendanceData[s.id] === 'Leave' ? 'checked' : ''}> Leave</label>
        </div></td></tr>`).join('');
            
        container.innerHTML = `<div class="card">
            <div id="scanner-view" class="hidden my-4 max-w-sm mx-auto"></div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">Attendance for ${date}</h3>

            </div>
            <div class="overflow-x-auto"><table class="w-full"><thead><tr class="border-b"><th class="p-4 text-left">Student</th><th class="p-4 text-left">Status</th></tr></thead><tbody>${rows || `<tr><td colspan="2" class="text-center py-8 text-gray-500">No students found for this class.</td></tr>`}</tbody></table></div>
            <div class="mt-6 flex justify-end"><button id="save-attendance-btn" class="bg-green-600 text-white font-semibold py-2 px-6 rounded-lg">Save Attendance</button></div></div>`;

        document.getElementById('mark-all-present').addEventListener('click', () => {
            studentsInClass.forEach(s => {
                const presentRadio = document.querySelector(`input[name="status_${s.id}"][value="Present"]`);
                if(presentRadio) presentRadio.checked = true;
            });
        });
        document.getElementById('save-attendance-btn').addEventListener('click', saveStudentAttendance);

    async function saveStudentAttendance() {
        const date = document.getElementById('attendance-date').value;
        const studentsInClass = students.filter(s => s.className === teacher.assignedClass && s.section === teacher.assignedSection);
        const newAttendance = {};
        studentsInClass.forEach(s => { newAttendance[s.id] = document.querySelector(`input[name="status_${s.id}"]:checked`).value; });
        const recordId = `${date}_${teacher.assignedClass}_${teacher.assignedSection}`;
        await db.ref(`attendance/${recordId}`).set({ id: recordId, date, className: teacher.assignedClass, section: teacher.assignedSection, attendance: newAttendance, lastUpdated: new Date().toISOString() });
        showToast('Attendance Saved!');
    }
    
    function calculateStudentResult(event) {
        if(!event.target) return;
        const studentId = event.target.dataset.studentId;
        const row = document.getElementById(`result-row-${studentId}`);
        if(!row) return;

        const inputs = row.querySelectorAll('.marks-input');
        let total = 0;
        let subjectsCount = 0;
        inputs.forEach(input => {
            const value = parseInt(input.value);
            if (!isNaN(value)) total += value;
            subjectsCount++;
        });

        const maxMarks = subjectsCount * 100;
        const percentage = maxMarks > 0 ? ((total / maxMarks) * 100).toFixed(1) : 0;
        document.getElementById(`total-${studentId}`).textContent = total;
        document.getElementById(`percent-${studentId}`).textContent = `${percentage}%`;
    }

    async function saveResults() {
        const examType = document.getElementById('exam-type').value;
        if(!examType) { showToast('Exam type is missing.'); return; }
        const newResultsData = {};
        document.querySelectorAll('.marks-input').forEach(input => {
            const studentId = input.dataset.studentId;
            const subject = input.dataset.subject;
            if (!newResultsData[studentId]) newResultsData[studentId] = {};
            newResultsData[studentId][subject] = parseInt(input.value) || 0;
        });
        const resultId = `${examType}_${teacher.assignedClass}_${teacher.assignedSection}`.replace(/ /g, '_');
        await db.ref(`results/${resultId}`).set({ id: resultId, examType, className: teacher.assignedClass, section: teacher.assignedSection, results: newResultsData, lastUpdated: new Date().toISOString() });
        showToast('Results saved successfully!');
    }

    function startStudentScanner() {
        renderStudentAttendanceSheet(); // Make sure the sheet is visible
        const scannerView = document.getElementById('scanner-view');
        scannerView.innerHTML = '<div id="student-qr-reader" class="border-2 rounded-lg"></div>';
        scannerView.classList.remove('hidden');

        studentQrScanner = new Html5Qrcode("student-qr-reader");

        const onScanSuccess = (decodedText, decodedResult) => {
            const studentId = decodedText;
            const student = students.find(s => s.id === studentId);
            if (student) {
                const presentRadio = document.querySelector(`#attendance-row-${studentId} input[value="Present"]`);
                if (presentRadio) {
                    if (!presentRadio.checked) {
                        presentRadio.checked = true;
                        showScanConfirmation(student.studentName);
                        const row = document.getElementById(`attendance-row-${studentId}`);
                        row.style.backgroundColor = '#dcfce7';
                        setTimeout(() => { row.style.backgroundColor = ''; }, 2500);
                    } else {
                         showToast(`${student.studentName} is already marked present.`, true);
                    }
                } else {
                    showToast(`Scanned ${student.studentName}, but they are not in the current class list.`, true);
                }
            } else {
                showToast("Invalid QR code.", true);
            }
        };

        studentQrScanner.start(
            { facingMode: "environment" },
            { fps: 5, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
            (error) => {} // onScanFailure
        ).catch(err => {
            showToast("Failed to start scanner. Check camera permissions.", true);
            console.error(err);
        });
    }

        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        mainContent.innerHTML = `<div class="text-center p-8"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div><p class="mt-4 text-gray-600">Loading your data...</p></div>`;
        
        try {
            const refs = {
                staff: db.ref('staff').once('value'),
                students: db.ref('students').once('value'),
                homework: db.ref('homework').once('value'),
                liveClasses: db.ref('liveClasses').once('value'),
                attendance: db.ref('attendance').once('value'),
                teacherAttendance: db.ref('teacherAttendance').once('value'),
                results: db.ref('results').once('value'),
                salaries: db.ref('salaries').once('value'),
                subjects: db.ref('subjects').once('value'),
            };

            const snapshots = await Promise.all(Object.values(refs));
            const [staffSnap, studentsSnap, homeworkSnap, liveClassesSnap, attendanceSnap, teacherAttendanceSnap, resultsSnap, salariesSnap, subjectsSnap] = snapshots;

            const allStaff = Object.values(staffSnap.val() || {});
            teacher = allStaff.find(s => s.id === loggedInUser.id);

            if (!teacher) { logout(); throw new Error('Teacher profile not found.'); }
            
            students = Object.values(studentsSnap.val() || {});
            homework = Object.values(homeworkSnap.val() || {});
            liveClasses = Object.values(liveClassesSnap.val() || {});
            attendanceRecords = Object.values(attendanceSnap.val() || {});
            teacherAttendanceRecords = Object.values(teacherAttendanceSnap.val() || {});
            results = Object.values(resultsSnap.val() || {});
            salaries = Object.values(salariesSnap.val() || {});
            classSubjects = subjectsSnap.val() || {};

            document.getElementById('teacher-info').innerHTML = `<p class="font-semibold">${teacher.staffName}</p><p class="text-sm text-gray-500">${teacher.role}</p>`;
            document.getElementById('logout-btn').addEventListener('click', logout);
            initResponsiveUI();
            setActiveTab('dashboard');

        } catch (error) {
            console.error("Failed to load teacher data:", error);
            mainContent.innerHTML = `<div class="card text-red-700 bg-red-100"><h3 class="font-bold">Error</h3><p>Could not load your data. Please log out and try again.</p></div>`;
        }
    }

    function showLogin() {
        document.getElementById('login-overlay').classList.remove('hidden');
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        const form = document.getElementById('teacher-login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mobile = document.getElementById('teacher-mobile').value;
            const password = document.getElementById('teacher-password').value;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Verifying...';
            
            try {
                const staffSnap = await db.ref('staff').once('value');
                const allStaff = Object.values(staffSnap.val() || {});
                const foundTeacher = allStaff.find(s => s.mobile === mobile && s.password === password);
                
                if (foundTeacher) {
                    const user = { role: 'teacher', id: foundTeacher.id };
                    sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                    runApp(user);
                } else {
                    showToast('Invalid Mobile No. or Password.');
                }
            } catch (err) {
                showToast('Login failed. Check connection.');
                console.error(err);
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        });
        
        let loggedInUser = null;
        try {
            const userData = sessionStorage.getItem('loggedInUser');
            if (userData) loggedInUser = JSON.parse(userData);
        } catch (e) {
            sessionStorage.removeItem('loggedInUser');
        }
        
        if (loggedInUser && loggedInUser.role === 'teacher') {
            runApp(loggedInUser);
        } else {
            showLogin();
        }
    });

    // --- ATTENDANCE REGISTER ---
    function renderAttendanceRegister() {
        const currentMonth = new Date().toISOString().slice(0, 7);
        mainContent.innerHTML = `
            <div class="card mb-6">
                <div class="flex items-end gap-4">
                    <div>
                        <label for="register-month" class="block text-sm font-medium">Month</label>
                        <input type="month" id="register-month" class="form-input mt-1" value="${currentMonth}">
                    </div>
                </div>
            </div>
            <div id="register-sheet-container"></div>`;
        document.getElementById('register-month').addEventListener('change', renderRegisterSheetForTeacher);
        renderRegisterSheetForTeacher();
    }

    function renderRegisterSheetForTeacher() {
        const monthValue = document.getElementById('register-month').value;
        const container = document.getElementById('register-sheet-container');
        if (!monthValue) return;

        const [year, month] = monthValue.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        
        const studentsInClass = students.filter(s => s.className === teacher.assignedClass && s.section === teacher.assignedSection)
                                       .sort((a,b) => a.studentName.localeCompare(b.studentName));
        
        let headerHtml = '<tr><th class="p-2 border sticky left-0 bg-gray-50 z-10">Student Name</th>';
        for (let day = 1; day <= daysInMonth; day++) {
            headerHtml += `<th class="p-2 border text-center">${day}</th>`;
        }
        headerHtml += '</tr>';

        const recordsForMonth = attendanceRecords.filter(r => r.date && r.date.startsWith(monthValue) && r.className === teacher.assignedClass && r.section === teacher.assignedSection);
        const recordsMap = new Map(recordsForMonth.map(r => [r.date, r.attendance]));

        let bodyHtml = '';
        studentsInClass.forEach(student => {
            let rowHtml = `<tr><td class="p-2 border font-semibold sticky left-0 bg-white z-10">${student.studentName}</td>`;
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${monthValue}-${String(day).padStart(2, '0')}`;
                const attendance = recordsMap.get(dateStr);
                const status = attendance ? (attendance[student.id] || 'A') : 'A';
                rowHtml += `<td class="p-2 border text-center font-bold cursor-pointer" data-date="${dateStr}" data-student-id="${student.id}" data-status="${status}" onclick="cycleAttendanceStatus(this)">${status.charAt(0)}</td>`;
            }
            rowHtml += '</tr>';
            bodyHtml += rowHtml;
        });

        container.innerHTML = `
            <div class="card">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm border-collapse">${headerHtml}${bodyHtml}</table>
                </div>
                <div class="mt-6 flex justify-end">
                    <button id="save-register-btn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded-lg">Save Changes</button>
                </div>
            </div>
        `;
        updateRegisterCellColors();
        document.getElementById('save-register-btn').addEventListener('click', saveAttendanceRegisterChanges);
    }

    function cycleAttendanceStatus(cell) {
        const statuses = ['P', 'A', 'L'];
        let currentStatus = cell.dataset.status;
        let nextIndex = (statuses.indexOf(currentStatus) + 1) % statuses.length;
        let nextStatus = statuses[nextIndex];
        cell.dataset.status = nextStatus;
        cell.textContent = nextStatus;
        cell.classList.add('bg-blue-100', 'modified'); // Mark as changed
        updateRegisterCellColors();
    }

    function updateRegisterCellColors() {
        document.querySelectorAll('#register-sheet-container td[data-status]').forEach(cell => {
            cell.classList.remove('bg-green-200', 'bg-red-200', 'bg-yellow-200');
            if (cell.classList.contains('modified')) return;
            switch(cell.dataset.status) {
                case 'P': cell.classList.add('bg-green-200'); break;
                case 'A': cell.classList.add('bg-red-200'); break;
                case 'L': cell.classList.add('bg-yellow-200'); break;
            }
        });
    }

    async function saveAttendanceRegisterChanges() {
        const modifiedCells = document.querySelectorAll('#register-sheet-container td.modified');
        if (modifiedCells.length === 0) {
            showToast("No changes to save.");
            return;
        }
        const updatesByDate = {};
        modifiedCells.forEach(cell => {
            const { date, studentId, status } = cell.dataset;
            if (!updatesByDate[date]) {
                updatesByDate[date] = {};
            }
            updatesByDate[date][studentId] = status === 'P' ? 'Present' : (status === 'A' ? 'Absent' : 'Leave');
        });
        
        try {
            for (const date in updatesByDate) {
                const recordId = `${date}_${teacher.assignedClass}_${teacher.assignedSection}`;
                const recordRef = db.ref(`attendance/${recordId}`);
                const snapshot = await recordRef.once('value');
                const existingRecord = snapshot.val() || { id: recordId, date, className: teacher.assignedClass, section: teacher.assignedSection, attendance: {} };
                
                Object.assign(existingRecord.attendance, updatesByDate[date]);
                existingRecord.lastUpdated = new Date().toISOString();
                await recordRef.set(existingRecord);
            }
            showToast("Attendance updated successfully!");
            // Re-fetch attendance data to be fresh
            const attendanceSnap = await db.ref('attendance').once('value');
            attendanceRecords = Object.values(attendanceSnap.val() || {});
            renderRegisterSheetForTeacher(); // Re-render the sheet
        } catch(err) {
            showToast("Error saving changes: " + err.message, true);
        }
    }

    // --- WEBRTC LIVE CLASS LOGIC ---
    function setupLiveClassListeners(classId) {
        const participantsRef = db.ref(`liveClasses/${classId}/participants`);
        addDBListener(participantsRef, 'child_added', snap => {
            const student = snap.val();
            if (student.id !== teacher.id) {
                connectToStudent(classId, student.id, student.name);
            }
            updateParticipantCount();
        });
        addDBListener(participantsRef, 'child_removed', snap => {
            const studentId = snap.key;
            disconnectFromStudent(studentId);
            updateParticipantCount();
        });

        const chatRef = db.ref(`liveClasses/${classId}/chat`);
        addDBListener(chatRef, 'child_added', snap => {
            const msg = snap.val();
            const chatBox = document.getElementById('chat-messages');
            if(!chatBox) return;
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('chat-message', msg.senderId === teacher.id ? 'self' : 'other');
            msgDiv.innerHTML = `<div class="font-bold text-sm">${msg.senderName}</div><div>${msg.text}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    function updateParticipantCount() {
        const count = Object.keys(peerConnections).length + 1; // +1 for teacher
        document.getElementById('participant-count').textContent = count;
    }

    async function connectToStudent(classId, studentId, studentName) {
        const pc = new RTCPeerConnection(rtcConfig);
        peerConnections[studentId] = pc;
        
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = event => {
            let videoContainer = document.getElementById(`video-container-${studentId}`);
            if (!videoContainer) {
                videoContainer = document.createElement('div');
                videoContainer.id = `video-container-${studentId}`;
                videoContainer.className = 'participant-video-container';
                videoContainer.innerHTML = `<video id="video-${studentId}" autoplay playsinline></video><div class="name-tag">${studentName}</div>`;
                document.getElementById('participants-list').appendChild(videoContainer);
            }
            const videoEl = document.getElementById(`video-${studentId}`);
            videoEl.srcObject = event.streams[0];
        };

        const signalingRef = db.ref(`liveClasses/${classId}/signaling/${studentId}`);
        pc.onicecandidate = event => {
            if (event.candidate) {
                signalingRef.child('fromTeacher/candidates').push(event.candidate.toJSON());
            }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await signalingRef.child('fromTeacher/offer').set({ type: offer.type, sdp: offer.sdp });

        addDBListener(signalingRef.child('fromStudent/answer'), 'value', async (snap) => {
            const answer = snap.val();
            if (answer && pc.signalingState !== 'closed' && pc.remoteDescription === null) {
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            }
        });

        addDBListener(signalingRef.child('fromStudent/candidates'), 'child_added', snap => {
            const candidate = snap.val();
            if (candidate && pc.signalingState !== 'closed') {
                pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
        });
    }

    function disconnectFromStudent(studentId) {
        if (peerConnections[studentId]) {
            peerConnections[studentId].close();
            delete peerConnections[studentId];
        }
        const videoContainer = document.getElementById(`video-container-${studentId}`);
        if (videoContainer) videoContainer.remove();
    }


</script>
